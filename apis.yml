name: Renren
description: 'Renren (人人网), originally launched as Xiaonei in 2005 and renamed in 2009,
  was one of China''s largest social networking platforms and was widely described as
  the "Facebook of China," especially popular among university students. Renren Inc. listed
  on the NYSE in 2011; the social-networking business later declined and the assets were
  sold in 2018. The site is now operated by Chengdu Renren Interactive Entertainment
  Technology Co., Ltd. and is undergoing a service upgrade. Historically Renren ran an
  Open Platform with an OAuth2 REST API (wiki.dev.renren.com) for third-party login and
  social integration; that developer surface is now defunct and no live API endpoints
  respond.'
